<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --blue:#1668E3; --blue-dark:#0F55BE; --blue-soft:#E8F1FE; --ink:#0E1B2E; --ink-2:#1B2B45;
  --body:#5C6C86; --line:#E7ECF4; --white:#fff; --soft:#F5F8FE; --navy:#0C1B33;
  --ok:#16A34A; --amber:#F59E0B; --red:#EF4444; --violet:#7C3AED; --teal:#0D9488; --pink:#EC4899;
  --r-sm:10px; --r:14px; --r-lg:20px;
  --shadow:0 1px 2px rgba(16,32,64,.05), 0 8px 24px rgba(16,32,64,.06);
  --shadow-lg:0 24px 60px rgba(12,32,70,.14);
  --wrap:1160px; --hdr:68px;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --display:'Poppins','Inter',system-ui,sans-serif;
}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font-family:var(--sans);color:var(--body);background:var(--white);font-size:15.5px;line-height:1.7;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);color:var(--ink);margin:0;line-height:1.22;letter-spacing:-.02em}
h1{font-size:clamp(2.1rem,5.4vw,3.35rem);font-weight:700}
h2{font-size:clamp(1.55rem,3.4vw,2.15rem);font-weight:700}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
a{color:var(--blue);text-decoration:none}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
ul{margin:0;padding:0;list-style:none}
:focus-visible{outline:3px solid rgba(22,104,227,.45);outline-offset:2px;border-radius:6px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 20px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:-9999px;top:8px;background:#fff;padding:10px 16px;border-radius:8px;z-index:100}
.skip:focus{left:16px}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.6) blur(10px);border-bottom:1px solid var(--line)}
.hdr-in{height:var(--hdr);display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:11px;flex:0 0 auto}
.brand-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(150deg,#3B86F7,#1157CC);display:grid;place-items:center;box-shadow:0 6px 14px rgba(22,104,227,.32)}
.brand-name{font-family:var(--display);font-weight:700;font-size:1.24rem;color:var(--ink);letter-spacing:-.03em;line-height:1.05}
.brand-sub{font-size:.665rem;color:var(--body);letter-spacing:.04em;line-height:1.4}
.nav{margin-left:auto;display:flex;align-items:center;gap:4px}
.nav a.nlink,.nav button.nlink{background:none;border:0;cursor:pointer;padding:9px 13px;border-radius:9px;font-size:.9rem;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.nav .nlink:hover{color:var(--blue);background:var(--soft)}
.nav .nlink.active{color:var(--blue);font-weight:600}
.dd{position:relative}
.dd-menu{position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(-6px);background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:8px;width:520px;display:grid;grid-template-columns:1fr 1fr;gap:2px;opacity:0;visibility:hidden;transition:.16s}
.dd:hover .dd-menu,.dd.open .dd-menu{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.dd-menu a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;color:var(--ink-2);font-size:.86rem;font-weight:500}
.dd-menu a:hover{background:var(--soft)}
.dd-menu .di{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto}
.hdr-cta{flex:0 0 auto;margin-left:8px}
.burger{display:none;margin-left:auto;background:none;border:1px solid var(--line);border-radius:10px;width:42px;height:40px;cursor:pointer}
.burger span{display:block;width:18px;height:2px;background:var(--ink);margin:3.5px auto;border-radius:2px;transition:.2s}
.mobile{display:none;border-top:1px solid var(--line);background:#fff;padding:10px 0 18px}
.mobile.show{display:block}
.mobile a{display:block;padding:11px 4px;font-weight:500;color:var(--ink-2);border-bottom:1px solid var(--line)}
.mobile .m-sub{padding-left:14px;font-size:.87rem;color:var(--body)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid transparent;border-radius:var(--r-sm);padding:13px 22px;font-weight:600;font-size:.92rem;cursor:pointer;transition:transform .12s ease,box-shadow .2s,background .2s;white-space:nowrap}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 8px 20px rgba(22,104,227,.28)}
.btn-primary:hover{background:var(--blue-dark);transform:translateY(-1px)}
.btn-primary[disabled]{background:#9FBEEC;box-shadow:none;cursor:not-allowed;transform:none}
.btn-ghost{background:#fff;color:var(--ink);border-color:var(--line);box-shadow:var(--shadow)}
.btn-ghost:hover{border-color:#C9D8F2;color:var(--blue)}
.btn-sm{padding:9px 15px;font-size:.85rem;border-radius:9px}
.btn-line{background:var(--soft);color:var(--blue);border-color:#D8E5FA}
.btn-line:hover{background:var(--blue-soft)}
.btn-sub{background:var(--blue);color:#fff;width:100%;justify-content:center}

/* ---------- hero ---------- */
.hero{background:linear-gradient(180deg,#EAF2FE 0%,#F4F8FF 62%,#FDFEFF 100%);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;width:620px;height:620px;right:-140px;top:-190px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9),rgba(219,234,254,.25));pointer-events:none}
.hero-in{display:grid;grid-template-columns:1.02fr .98fr;gap:36px;align-items:center;padding:62px 0 70px;position:relative}
.pill{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid #D9E7FB;color:var(--blue);font-size:.755rem;font-weight:600;padding:7px 13px;border-radius:999px;box-shadow:0 4px 12px rgba(22,104,227,.08)}
.hero h1{margin:20px 0 0}
.hero h1 .accent{color:var(--blue);display:block}
.hero-lede{margin-top:18px;max-width:465px;font-size:1rem}
.hero-btns{display:flex;gap:14px;margin-top:28px;flex-wrap:wrap}
.stats{display:flex;gap:30px;margin-top:36px;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:10px}
.stat-ic{width:34px;height:34px;border-radius:10px;background:#fff;display:grid;place-items:center;box-shadow:0 3px 10px rgba(16,32,64,.09)}
.stat b{display:block;font-family:var(--display);font-size:1rem;color:var(--ink);line-height:1.2}
.stat span{font-size:.72rem;color:var(--body)}
.stores{display:flex;gap:13px;margin-top:30px;flex-wrap:wrap}
.store{display:flex;align-items:center;gap:9px;background:#0A0F1C;color:#fff;border-radius:11px;padding:9px 17px;min-width:158px;transition:transform .15s}
.store:hover{transform:translateY(-2px)}
.store small{display:block;font-size:.6rem;opacity:.8;line-height:1.3;letter-spacing:.03em;text-transform:uppercase}
.store b{font-size:.95rem;font-weight:600;letter-spacing:-.01em;line-height:1.15}

/* phone mock */
.hero-art{position:relative;display:flex;justify-content:center;align-items:flex-end;min-height:430px}
.blob{position:absolute;inset:auto 0 0 0;height:88%;background:linear-gradient(140deg,#DCEAFE,#EFF5FF);border-radius:46% 54% 40% 60%/48% 42% 58% 52%;filter:blur(1px)}
.dots{position:absolute;right:6px;top:38px;width:74px;height:74px;background-image:radial-gradient(#B9CFF2 1.6px,transparent 1.6px);background-size:12px 12px;opacity:.85}
.phone{position:relative;width:245px;background:#111827;border-radius:34px;padding:9px;box-shadow:var(--shadow-lg);z-index:2}
.phone-scr{background:#F6F9FF;border-radius:27px;overflow:hidden;padding:11px 10px 0}
.ph-top{display:flex;align-items:center;gap:6px;font-size:.7rem;font-weight:600;color:var(--ink);margin-bottom:9px}
.ph-top .sp{margin-left:auto;display:flex;gap:5px}
.ph-card{background:linear-gradient(120deg,#1668E3,#3D8BF8);border-radius:14px;padding:12px;color:#fff;display:flex;gap:8px;align-items:center}
.ph-card b{font-size:.78rem;display:block;line-height:1.25;font-family:var(--display)}
.ph-card span{font-size:.58rem;opacity:.9;line-height:1.4;display:block;margin-top:3px}
.ph-card .mini{width:52px;height:38px;border-radius:7px;background:#fff;flex:0 0 auto;display:grid;place-items:center}
.ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}
.ph-tile{background:#fff;border:1px solid #EAF0FA;border-radius:11px;padding:9px 4px;text-align:center;font-size:.53rem;font-weight:600;color:var(--ink-2)}
.ph-tile i{display:grid;place-items:center;margin-bottom:4px}
.ph-recent{display:flex;justify-content:space-between;align-items:center;font-size:.6rem;font-weight:600;color:var(--ink);margin:11px 0 6px}
.ph-recent span{color:var(--blue);font-size:.55rem}
.ph-row{display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:7px 9px;margin-bottom:6px}
.ph-row .thumb{width:22px;height:26px;border-radius:4px;background:#EEF3FC;border:1px solid #E2EAF7;flex:0 0 auto}
.ph-row b{font-size:.58rem;color:var(--ink);display:block;line-height:1.3;font-family:var(--sans);font-weight:600}
.ph-row small{font-size:.5rem;color:var(--body)}
.ph-row .dots3{margin-left:auto;color:#9AA9C0;letter-spacing:1px;font-size:.6rem}
.paper{position:absolute;left:-6px;top:64px;width:132px;height:166px;background:#fff;border-radius:8px;box-shadow:0 16px 34px rgba(12,32,70,.16);transform:rotate(-11deg);padding:16px 13px;z-index:1}
.paper::after{content:"CONTRACT";position:absolute;left:13px;top:44px;font-family:var(--display);font-weight:700;font-size:.72rem;color:#94A3B8;letter-spacing:.06em}
.paper i{display:block;height:5px;border-radius:3px;background:#EDF1F7;margin-bottom:7px}
.paper i:nth-child(2){width:72%}.paper i:nth-child(4){width:56%}.paper i:nth-child(6){width:80%}
.scanner{position:absolute;right:-4px;bottom:16px;width:150px;z-index:1}
.scan-lid{height:34px;background:linear-gradient(160deg,#22304A,#101A2C);border-radius:9px 9px 3px 3px}
.scan-body{height:44px;background:linear-gradient(160deg,#2C5CC5,#17398A);border-radius:0 0 11px 11px;position:relative}
.scan-body::after{content:"";position:absolute;left:14px;right:14px;top:9px;height:5px;background:rgba(255,255,255,.4);border-radius:3px}
.scan-sheet{position:absolute;left:16px;right:16px;bottom:100%;height:52px;background:#fff;border-radius:5px 5px 0 0;box-shadow:0 -8px 20px rgba(12,32,70,.12);padding:9px}
.scan-sheet i{display:block;height:4px;background:#E9EEF6;border-radius:3px;margin-bottom:6px}
.plant{position:absolute;right:-10px;bottom:14px;width:34px;height:34px;border-radius:6px 6px 12px 12px;background:#E9EDF3}

/* ---------- sections ---------- */
.sec{padding:66px 0}
.sec-soft{background:var(--soft)}
.eyebrow{text-align:center;color:var(--blue);font-size:.72rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.sec-head{text-align:center;max-width:640px;margin:0 auto 38px}
.sec-head h2{margin:10px 0 8px}
.sec-head p{font-size:.95rem}

/* tool grid */
.tool-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.tcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px 14px;text-align:center;transition:transform .16s,box-shadow .2s,border-color .2s;display:block}
.tcard:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:#D9E5F8}
.tcard .ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;margin:0 auto 13px}
.tcard h3{font-size:.94rem}
.tcard p{font-size:.775rem;margin-top:4px;color:var(--body)}
.center{text-align:center;margin-top:30px}

/* steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;position:relative}
.step{text-align:center;position:relative}
.step .ic{width:58px;height:58px;border-radius:50%;background:var(--blue-soft);display:grid;place-items:center;margin:0 auto 14px;border:5px solid #fff;box-shadow:0 6px 16px rgba(22,104,227,.12)}
.step h3{font-size:.95rem}
.step p{font-size:.8rem;margin-top:5px}
.step:not(:last-child)::after{content:"";position:absolute;top:29px;left:calc(50% + 44px);right:calc(-50% + 44px);border-top:2px dashed #C9D9F2}

/* why */
.why{display:grid;grid-template-columns:.86fr 1.14fr;gap:44px;align-items:center}
.why h2{margin:12px 0 20px}
.eyebrow.left{text-align:left}
.checks li{display:flex;gap:11px;align-items:flex-start;margin-bottom:12px;font-size:.9rem;color:var(--ink-2)}
.checks .ck{width:19px;height:19px;border-radius:50%;background:var(--blue);display:grid;place-items:center;flex:0 0 auto;margin-top:3px}
.feat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.fcard{border-radius:var(--r);padding:22px 15px;text-align:center;border:1px solid rgba(0,0,0,.03)}
.fcard .ic{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;margin:0 auto 12px;box-shadow:0 4px 12px rgba(16,32,64,.08)}
.fcard h3{font-size:.9rem}
.fcard p{font-size:.775rem;margin-top:6px}

/* blog */
.blog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.post{display:grid;grid-template-columns:112px 1fr;gap:16px;align-items:center}
.post .ph{height:92px;border-radius:11px;background:linear-gradient(140deg,#DCE8FB,#F0F5FF);display:grid;place-items:center;overflow:hidden}
.post h3{font-size:.9rem;line-height:1.42}
.post .meta{font-size:.7rem;color:#8492AC;margin:6px 0 8px}
.post .more{font-size:.79rem;font-weight:600;display:inline-flex;gap:6px;align-items:center}

/* cta band */
.band{background:linear-gradient(110deg,#1259CE,#2E81F5);border-radius:var(--r-lg);padding:34px 38px;display:grid;grid-template-columns:auto 1fr auto auto;gap:26px;align-items:center;color:#fff;box-shadow:0 22px 44px rgba(18,89,206,.28)}
.band h2{color:#fff;font-size:1.5rem}
.band p{font-size:.87rem;opacity:.92;margin-top:7px;max-width:420px}
.band-mark{width:74px;height:74px;border-radius:18px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.band .stores{margin:0}
.band-phone{width:96px;background:#0B1220;border-radius:16px;padding:5px}
.band-phone div{background:#EEF4FF;border-radius:12px;height:118px;padding:7px}
.band-phone .b1{background:#1668E3;border-radius:7px;height:44px;margin-bottom:6px}
.band-phone .b2{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.band-phone .b2 i{height:15px;background:#fff;border-radius:4px;display:block}

/* footer */
.ftr{background:var(--navy);color:#9FB0CB;padding:52px 0 0;margin-top:0}
.ftr-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 1.35fr;gap:28px}
.ftr h4{color:#fff;font-size:.9rem;margin-bottom:14px;font-family:var(--display);font-weight:600}
.ftr a{color:#9FB0CB;font-size:.845rem;display:block;padding:4px 0}
.ftr a:hover{color:#fff}
.ftr .brand-name{color:#fff}.ftr .brand-sub{color:#8095B4}
.ftr p.about{font-size:.845rem;margin-top:14px;max-width:270px}
.socials{display:flex;gap:9px;margin-top:16px}
.socials a{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.09);display:grid;place-items:center;padding:0}
.socials a:hover{background:var(--blue)}
.sub-form{display:flex;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:9px;padding:5px 5px 5px 13px;align-items:center;margin-top:12px}
.sub-form input{background:none;border:0;outline:none;color:#fff;flex:1;font-size:.83rem;min-width:0}
.sub-form input::placeholder{color:#7E92B2}
.ftr .btn-sub{margin-top:9px;padding:10px}
.ftr-bot{border-top:1px solid rgba(255,255,255,.09);margin-top:38px;padding:18px 0;text-align:center;font-size:.8rem}

/* ---------- tool pages ---------- */
.page-head{background:linear-gradient(180deg,#EDF4FE,#FBFDFF);border-bottom:1px solid var(--line);padding:34px 0 30px}
.crumbs{font-size:.78rem;color:var(--body);margin-bottom:12px}
.crumbs a{color:var(--body)}.crumbs a:hover{color:var(--blue)}
.page-head-in{display:flex;gap:16px;align-items:center}
.page-head .ic{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;flex:0 0 auto}
.page-head h1{font-size:clamp(1.5rem,3.4vw,2rem)}
.page-head p{margin-top:6px;font-size:.93rem;max-width:640px}
.tool-wrap{max-width:820px;margin:0 auto;padding:36px 20px 60px}
.drop{border:2px dashed #C9D9F2;background:#FAFCFF;border-radius:var(--r-lg);padding:44px 22px;text-align:center;cursor:pointer;transition:.18s}
.drop:hover,.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.drop .ic{width:58px;height:58px;border-radius:50%;background:var(--blue-soft);display:grid;place-items:center;margin:0 auto 14px}
.drop b{display:block;font-family:var(--display);color:var(--ink);font-size:1.02rem}
.drop small{display:block;margin-top:5px;font-size:.82rem}
.files{margin-top:20px;display:grid;gap:9px}
.frow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff}
.frow .fi{width:34px;height:34px;border-radius:9px;background:var(--blue-soft);display:grid;place-items:center;flex:0 0 auto}
.frow b{font-size:.86rem;color:var(--ink);font-weight:600;display:block;word-break:break-all;line-height:1.35}
.frow small{font-size:.74rem}
.frow .acts{margin-left:auto;display:flex;gap:4px;flex:0 0 auto}
.iconbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--body)}
.iconbtn:hover{color:var(--blue);border-color:#C9D8F2;background:var(--soft)}
.iconbtn[disabled]{opacity:.35;cursor:not-allowed}
.opts{margin-top:22px;border:1px solid var(--line);border-radius:var(--r);padding:18px;background:#fff}
.opts h3{font-size:.86rem;text-transform:uppercase;letter-spacing:.08em;color:var(--body);font-family:var(--sans);font-weight:600;margin-bottom:12px}
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:.83rem;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field input[type=text],.field input[type=password],.field input[type=number],.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:.88rem;outline:none;background:#fff}
.field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(22,104,227,.12)}
.field .hint{font-size:.76rem;margin-top:5px}
.segs{display:flex;flex-wrap:wrap;gap:8px}
.seg{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 14px;font-size:.83rem;font-weight:500;cursor:pointer;color:var(--ink-2)}
.seg.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);font-weight:600}
.run{margin-top:22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.note{font-size:.8rem;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:18px;display:flex;gap:9px}
.bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:16px}
.bar i{display:block;height:100%;background:var(--blue);width:0;border-radius:99px;transition:width .25s}
.status{font-size:.83rem;margin-top:9px}
.result{margin-top:20px;border:1px solid #CFEBD8;background:#F4FCF6;border-radius:var(--r);padding:18px}
.result h3{color:#14713C;font-size:1rem;margin-bottom:4px}
.result .outs{display:grid;gap:8px;margin-top:14px}
.out{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid #DCEEE3;border-radius:11px;padding:10px 13px}
.out b{font-size:.85rem;color:var(--ink);word-break:break-all}
.out small{font-size:.74rem}
.out .btn{margin-left:auto}
.err{border:1px solid #F6CFCF;background:#FEF5F5;color:#A02525;border-radius:12px;padding:12px 14px;margin-top:16px;font-size:.85rem}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px;margin-top:18px}
.thumb-c{border:1px solid var(--line);border-radius:11px;padding:8px;text-align:center;background:#fff;cursor:pointer;position:relative}
.thumb-c.sel{border-color:var(--blue);box-shadow:0 0 0 3px rgba(22,104,227,.14)}
.thumb-c canvas,.thumb-c img{width:100%;height:auto;border-radius:6px;border:1px solid var(--line);transition:transform .2s}
.thumb-c span{font-size:.72rem;display:block;margin-top:6px}
textarea.out-text{width:100%;min-height:230px;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:.85rem;line-height:1.65;resize:vertical;outline:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.sig-pad{border:1px solid var(--line);border-radius:12px;background:#fff;touch-action:none;width:100%;height:180px;cursor:crosshair}
.stage{position:relative;display:inline-block;max-width:100%;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:14px}
.stage canvas{display:block;max-width:100%;height:auto}
.stage canvas.ov{position:absolute;left:0;top:0;width:100%;height:100%;cursor:crosshair}
.stage .ghost{position:absolute;pointer-events:none;border:1.5px dashed var(--blue);background:rgba(22,104,227,.06)}

/* content pages */
.prose{max-width:760px;margin:0 auto;padding:42px 20px 64px}
.prose h2{font-size:1.35rem;margin:30px 0 10px}
.prose h3{font-size:1.02rem;margin:22px 0 8px}
.prose p{margin-bottom:14px}
.prose ul{margin:0 0 16px;padding-left:20px;list-style:disc}
.prose li{margin-bottom:7px}
.faq{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff;overflow:hidden}
.faq summary{cursor:pointer;padding:14px 16px;font-weight:600;color:var(--ink);font-size:.92rem;list-style:none;display:flex;justify-content:space-between;gap:10px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--blue);font-size:1.1rem}
.faq[open] summary::after{content:"−"}
.faq .fa{padding:0 16px 15px;font-size:.88rem}
.card-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-size:.87rem;opacity:0;pointer-events:none;transition:.25s;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:980px){
  .nav{display:none}.burger{display:block}.hdr-cta{display:none}
  .hero-in{grid-template-columns:1fr;padding:40px 0 48px}
  .hero-art{order:-1;min-height:360px}
  .tool-grid{grid-template-columns:repeat(3,1fr)}
  .steps{grid-template-columns:repeat(2,1fr);gap:28px}
  .step::after{display:none!important}
  .why{grid-template-columns:1fr;gap:28px}
  .feat-grid{grid-template-columns:repeat(2,1fr)}
  .blog-grid{grid-template-columns:1fr}
  .band{grid-template-columns:1fr;text-align:center;padding:28px 22px}
  .band .stores{justify-content:center}.band-mark,.band-phone{margin:0 auto}
  .ftr-grid{grid-template-columns:1fr 1fr}
  .contact-grid{grid-template-columns:1fr}
}
@media (max-width:620px){
  .tool-grid{grid-template-columns:repeat(2,1fr)}
  .feat-grid,.steps{grid-template-columns:1fr}
  .ftr-grid{grid-template-columns:1fr}
  .post{grid-template-columns:88px 1fr}
  .sec{padding:48px 0}
  .stats{gap:18px}
  .dd-menu{width:auto}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>

const POSTS = [
  { slug:'scan-documents-on-mobile', title:'How to Scan Documents on Mobile Like a Pro', date:'May 20, 2026', cat:'Tips', tint:'#DDE9FC',
    excerpt:'Nine habits that turn a phone camera into a scanner good enough for a bank, a landlord or a tax office.',
    body:`<p>A phone camera and a flatbed scanner capture the same page, but they fail in different ways. The scanner controls the light and the distance for you. On a phone, both are yours to manage, and almost every bad scan comes down to one of them.</p>
<h2>Light beats megapixels</h2><p>Put the page near a window, side-on rather than facing the sun. Overhead room lights throw your own shadow across the paper, which is the single most common reason a scan comes back grey and blotchy. If you must use the flash, hold the phone further back and zoom in, so the light spreads instead of blowing out the centre.</p>
<h2>Shoot square to the page</h2><p>Hold the phone parallel to the paper, not tilted over it. Perspective correction can rescue a small angle, but stretching a badly skewed photo smears the letters, and OCR accuracy falls off quickly once that happens.</p>
<h2>Fill the frame</h2><p>Leave a small border around the page and nothing more. Every pixel spent on your desk is a pixel not spent on the text.</p>
<h2>Pick the right output</h2><ul><li>Black and white for plain text: smallest file, sharpest letters.</li><li>Greyscale for pages with photographs or stamps.</li><li>Colour only when the colour carries meaning, such as a signature in blue ink or a highlighted clause.</li></ul>
<h2>Check before you send</h2><p>Zoom to 100% on the smallest text in the document. If you cannot read it comfortably on screen, neither can the person receiving it, and neither can an OCR engine. Reshoot rather than send.</p>
<h2>Name files so you can find them</h2><p>A name like <code>2026-05-invoice-acme.pdf</code> sorts itself chronologically and survives being emailed around. <code>scan_0043.pdf</code> does not.</p>` },
  { slug:'pdf-tools-you-should-use', title:'Top 7 PDF Tools You Should Use Every Day', date:'May 18, 2026', cat:'Tools', tint:'#FCE4E4',
    excerpt:'Merge, split, compress, rotate, convert, sign, protect — the small operations that remove most PDF friction.',
    body:`<p>Most PDF frustration comes from a handful of repeated tasks. Learn these seven and the format stops getting in your way.</p>
<h2>1. Merge</h2><p>One application, one file. Combine the form, the ID and the proof of address before you send them, instead of making the reader open three attachments.</p>
<h2>2. Split</h2><p>The opposite move, and just as useful. Send only the two pages that matter rather than the whole 90-page report.</p>
<h2>3. Compress</h2><p>Upload portals still cap attachments at 2, 5 or 10 MB. Compressing a scan usually clears the limit in one pass.</p>
<h2>4. Rotate</h2><p>Sideways pages read fine on a laptop, where you can turn the view, and terribly on a printout. Fix it at the source.</p>
<h2>5. Image to PDF</h2><p>Photos of receipts scattered through a camera roll are hard to submit. One PDF, in date order, is easy.</p>
<h2>6. eSign</h2><p>Printing a contract to sign it, then scanning it back, degrades the document and wastes fifteen minutes. Place the signature directly on the page instead.</p>
<h2>7. Lock</h2><p>Payslips, medical letters and contracts pass through inboxes that are not always private. A password costs you a few seconds.</p>
<p>All seven run in this browser tab, on your device, with no account and no upload.</p>` },
  { slug:'keep-your-documents-safe', title:'Keep Your Documents Safe: Best Practices', date:'May 15, 2026', cat:'Security', tint:'#E3EEF9',
    excerpt:'Where scanned documents actually leak, and the handful of habits that close most of the gaps.',
    body:`<p>A scanned passport is more dangerous than the physical one, because a copy can be in a hundred places at once and you will never know. Treat the file with the same care as the document.</p>
<h2>Know where processing happens</h2><p>Many online converters upload your file to a server, process it there and promise to delete it later. That promise may well be kept, but it is still a copy on someone else's disk. Tools that run in the browser never send the file at all — worth checking before you hand over anything sensitive.</p>
<h2>Redact properly</h2><p>Drawing a black box over a number in an image editor and saving as PDF hides it visually while leaving the text underneath, where anyone can select and copy it. Remove the content, then flatten the page to an image, then check by trying to select the text.</p>
<h2>Password-protect what you send</h2><p>Email is a series of hops between servers. Encrypt the attachment and send the password by a different channel, such as a text message. A password in the same email as the file protects nothing.</p>
<h2>Prune your camera roll</h2><p>Photos of ID documents linger in cloud backups for years. Once the scan is filed, delete the original photo from the phone and from the deleted items folder.</p>
<h2>Strip metadata when it matters</h2><p>A PDF can carry the author name, the software used and the creation date. Rarely a problem, occasionally revealing. Check the document properties before publishing something publicly.</p>` }

    async run(st) {

/* ---------- PDF editor canvas ---------- */
function moveEditorPage(d) {
  const e = ST.extra, j = e.at + d;
  if (j < 0 || j >= e.order.length) return;
  const t = e.order[e.at]; e.order[e.at] = e.order[j]; e.order[j] = t;
  e.at = j; paintEditor();
}
async function paintEditor() {
  const e = ST.extra; if (!e || !e.doc) return;
  const orig = e.order[e.at];
  const page = await e.doc.getPage(orig + 1);
  const base = page.getViewport({ scale: 1 });
  const vp = page.getViewport({ scale: Math.min(620 / base.width, 1.7) });
  const cv = $('#pv'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
  const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
  await page.render({ canvasContext: cx, viewport: vp }).promise;
  const ov = $('#ov'); ov.width = cv.width; ov.height = cv.height;
  e.pw = base.width;
  $('#edLabel').textContent = 'Page ' + (e.at + 1) + ' of ' + e.order.length + ' (original ' + (orig + 1) + ')';
  drawOverlay();
}
function drawOverlay(temp) {
  const ov = $('#ov'); if (!ov) return;
  const cx = ov.getContext('2d'); if (!cx) return;
  cx.clearRect(0, 0, ov.width, ov.height);
  const HEX = { black: '#111827', red: '#D92929', blue: '#1668E3', yellow: '#F5B80D' };
  const TSZ = { sm: 10, med: 14, lg: 20 }, WSZ = { sm: 1.5, med: 3, lg: 5 };
  const scale = ov.width / (ST.extra.pw || ov.width);
  const list = (ST.extra.edits[ST.extra.order[ST.extra.at]] || []).concat(temp ? [temp] : []);
  list.forEach(op => {
    const col = HEX[op.color] || '#111827';
    if (op.t === 'text') {
      cx.fillStyle = col;
      cx.font = (TSZ[op.size] * scale) + 'px Helvetica, Arial, sans-serif';
      cx.textBaseline = 'alphabetic';
      cx.fillText(op.text, op.x * ov.width, op.y * ov.height);

      cx.fillStyle = col; cx.globalAlpha = .32;
      cx.fillRect(Math.min(op.x, op.x2) * ov.width, Math.min(op.y, op.y2) * ov.height,
        Math.abs(op.x2 - op.x) * ov.width, Math.abs(op.y2 - op.y) * ov.height);
      cx.globalAlpha = 1;
    } else if (op.t === 'draw' && op.pts.length > 1) {
      cx.strokeStyle = col; cx.lineWidth = WSZ[op.size] * scale;
      cx.lineCap = 'round'; cx.lineJoin = 'round';
      cx.beginPath(); cx.moveTo(op.pts[0].x * ov.width, op.pts[0].y * ov.height);
      op.pts.forEach(p => cx.lineTo(p.x * ov.width, p.y * ov.height));

}
function bindEditorCanvas() {
  const ov = $('#ov'); if (!ov) return;
  const pos = ev => { const b = ov.getBoundingClientRect(); return { x: (ev.clientX - b.left) / b.width, y: (ev.clientY - b.top) / b.height }; };
  const push = op => {
    const k = ST.extra.order[ST.extra.at];
    (ST.extra.edits[k] = ST.extra.edits[k] || []).push(op);
    drawOverlay();
  };
  let live = null;
  ov.addEventListener('pointerdown', ev => {
    const p = pos(ev);
    if (p.x < 0 || p.x > 1 || p.y < 0 || p.y > 1) return;
    if (ST.opt.mode === 'text') {
      const txt = ($('#edTxt') && $('#edTxt').value || '').trim();
      if (!txt) return toast('Type the text first, then click the page.');
      push({ t: 'text', x: p.x, y: p.y, text: txt, color: ST.opt.color, size: ST.opt.size });
      return;
    }
    ov.setPointerCapture(ev.pointerId);
    live = ST.opt.mode === 'draw'
      ? { t: 'draw', pts: [p], color: ST.opt.color, size: ST.opt.size }
      : { t: 'hl', x: p.x, y: p.y, x2: p.x, y2: p.y, color: ST.opt.color };
    drawOverlay(live);
  });
  ov.addEventListener('pointermove', ev => {
    if (!live) return;
    const p = pos(ev);
    if (live.t === 'draw') live.pts.push(p); else { live.x2 = p.x; live.y2 = p.y; }
    drawOverlay(live);
  });
  const end = () => {
    if (!live) return;
    const ok = live.t === 'draw' ? live.pts.length > 1 : (Math.abs(live.x2 - live.x) > .004 && Math.abs(live.y2 - live.y) > .004);
    const op = live; live = null;
    if (ok) push(op); else drawOverlay();
  };
  ov.addEventListener('pointerup', end);
  ov.addEventListener('pointercancel', end);
}

/* ---------- tool helpers ---------- */
async function embedCanvasJpg(pdfDoc, canvas, q) {
  const blob = await canvasBlob(canvas, 'image/jpeg', q);
  return pdfDoc.embedJpg(await blob.arrayBuffer());
}
function loadImage(file) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { URL.revokeObjectURL(u); res(img); };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('That image could not be opened.')); };
    img.src = u;
  });
}
async function paintPreview() {
  const doc = ST.extra.doc; if (!doc) return;
  const page = await doc.getPage(ST.extra.page);
  const base = page.getViewport({ scale: 1 });
  const scale = Math.min(560 / base.width, 1.6);
  const vp = page.getViewport({ scale: scale });
  const cv = $('#pv'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
  const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
  await page.render({ canvasContext: cx, viewport: vp }).promise;
  ST.extra.pos = null; $('#ghost').style.display = 'none';
}
function signatureCanvas() {
  if (ST.opt.mode === 'type') {
    const txt = ($('#sigTxt') && $('#sigTxt').value || '').trim();
    if (!txt) return null;
    const cv = document.createElement('canvas'); cv.width = 900; cv.height = 260;
    const cx = cv.getContext('2d');
    cx.clearRect(0, 0, cv.width, cv.height);
    cx.fillStyle = '#111827'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.font = 'italic 600 120px Georgia, "Times New Roman", serif';
    cx.fillText(txt, cv.width / 2, cv.height / 2);
    return cv;
  }
  const pad = $('#pad');
  if (!pad || !pad._drawn) return null;
  return trimCanvas(pad);
}
function trimCanvas(src) {
  const cx = src.getContext('2d'), d = cx.getImageData(0, 0, src.width, src.height).data;
  let x0 = src.width, y0 = src.height, x1 = 0, y1 = 0, found = false;
  for (let y = 0; y < src.height; y++) for (let x = 0; x < src.width; x++) {
    if (d[(y * src.width + x) * 4 + 3] > 12) { found = true; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (!found) return null;
  const pad = 8;
  x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad);
  x1 = Math.min(src.width, x1 + pad); y1 = Math.min(src.height, y1 + pad);
  const out = document.createElement('canvas');
  out.width = x1 - x0; out.height = y1 - y0;
  out.getContext('2d').drawImage(src, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
  return out;
}
function initSignaturePad() {
  const pad = $('#pad'); if (!pad) return;
  const r = pad.getBoundingClientRect();
  pad.width = Math.round(r.width * 2); pad.height = 360;
  const cx = pad.getContext && pad.getContext('2d');
  if (!cx) return;
  cx.lineWidth = 4.5; cx.lineCap = 'round'; cx.lineJoin = 'round'; cx.strokeStyle = '#111827';
  let drawing = false;
  const pt = e => { const b = pad.getBoundingClientRect(); return { x: (e.clientX - b.left) * (pad.width / b.width), y: (e.clientY - b.top) * (pad.height / b.height) }; };
  pad.addEventListener('pointerdown', e => { drawing = true; pad.setPointerCapture(e.pointerId); const p = pt(e); cx.beginPath(); cx.moveTo(p.x, p.y); });
  pad.addEventListener('pointermove', e => { if (!drawing) return; const p = pt(e); cx.lineTo(p.x, p.y); cx.stroke(); pad._drawn = true; });
  pad.addEventListener('pointerup', () => { drawing = false; });
  pad.addEventListener('pointerleave', () => { drawing = false; });
  $('#padClear').onclick = () => { cx.clearRect(0, 0, pad.width, pad.height); pad._drawn = false; };
}

function viewTool(slug) {

  const related = TOOLS.filter(x => x.slug !== slug).slice(0, 5).map(toolCard).join('');

      '<div id="prog"></div><div id="msg"></div><div id="res"></div>' +

      'Processing happens in your browser, so nothing is uploaded and nothing is stored.</span></div>' +
    '</div>' +

    '<p>' + esc(t.desc) + '</p>' + faqBlock(t.faqs) + '</div>' +

function initTool(slug) {
  const sp = ENGINE[slug];
  const fi = $('#fi'), drop = $('#drop');
  const take = list => {
    const arr = Array.from(list).filter(f => f.size > 0);
    if (!arr.length) return;
    ST.files = sp.multiple ? ST.files.concat(arr) : [arr[0]];
    UI.clear(); $('#extra').innerHTML = '';
    paintFiles();
    if (sp.onFiles) Promise.resolve(sp.onFiles(ST)).catch(e => UI.error(e.message));
  };
  drop.onclick = () => fi.click();
  drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fi.click(); } };
  fi.onchange = () => { take(fi.files); fi.value = ''; };
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => take(e.dataTransfer.files));
  $('#reset').onclick = () => { location.hash = '#/tools/' + slug; renderRoute(true); };
  $('#go').onclick = async () => {
    const btn = $('#go');
    UI.clear(); btn.disabled = true; btn.textContent = 'Working…';
    try { await sp.run(ST); }
    catch (e) {
      const m = String(e && e.message || e);
      UI.error(/encrypt|password/i.test(m) && !/do not match|6 characters/i.test(m)

    }
    btn.disabled = false; btn.textContent = sp.cta;
  };
  if (slug === 'esign-pdf') initSignaturePad();
  applyConditionalFields();
}
function applyConditionalFields() {

}

/* ---------- SEO head ---------- */
function setMeta(title, desc, path, faqs) {
  document.title = title;
  const set = (sel, attr, val) => { const el = $(sel); if (el) el.setAttribute(attr, val); };
  set('meta[name="description"]', 'content', desc);
  set('meta[property="og:title"]', 'content', title);
  set('meta[property="og:description"]', 'content', desc);
  set('meta[name="twitter:title"]', 'content', title);
  set('meta[name="twitter:description"]', 'content', desc);
  const url = 'https://scanix.hassantayyabdev.workers.dev/' + (path ? path + '/' : '');
  set('link[rel="canonical"]', 'href', url);
  set('meta[property="og:url"]', 'content', url);
  const old = $('#ld-page'); if (old) old.remove();
  if (faqs && faqs.length) {
    const s = document.createElement('script');
    s.type = 'application/ld+json'; s.id = 'ld-page';
    s.textContent = JSON.stringify({
      '@context': 'https://schema.org', '@type': 'FAQPage',
      mainEntity: faqs.map(f => ({ '@type': 'Question', name: f[0], acceptedAnswer: { '@type': 'Answer', text: f[1].replace(/<[^>]+>/g, '') } }))

/* ---------- router ---------- */
function renderRoute(keepScroll) {
  const raw = (location.hash ? location.hash.replace(/^#\/?/, '') : (window.__ROUTE__ || '')).replace(/\/+$/, '');
  const p = raw.split('/').filter(Boolean);
  let body = '', title = '', desc = '', faqs = null;
  if (!p.length) { body = viewHome(); title = 'Scanix — Scan Any Document. Anywhere, Anytime.'; desc = 'Scanix is a document scanner app and a free online PDF toolkit. Scan, convert, merge, split, compress, sign and protect documents right in your browser.'; }
  else if (p[0] === 'tools' && p[1]) {
    const t = T[p[1]];
    if (t) { body = viewTool(p[1]); title = t.title + ' — Scanix'; desc = t.desc; faqs = t.faqs; }
    else { body = view404(); title = 'Page not found — Scanix'; desc = 'This page does not exist.'; }
  }
  else if (p[0] === 'tools') { body = viewTools(); title = 'Free online PDF tools — Scanix'; desc = 'Ten free PDF tools that run in your browser: OCR, compress, split, merge, rotate, convert, sign and lock. No signup, no upload.'; }
  else if (p[0] === 'blog' && p[1]) { const b = PB[p[1]]; body = viewPost(p[1]); title = (b ? b.title : 'Not found') + ' — Scanix Blog'; desc = b ? b.excerpt : ''; }
  else if (p[0] === 'blog') { body = viewBlog(); title = 'Blog — scanning tips and PDF guides | Scanix'; desc = 'Practical advice on scanning documents, working with PDFs and keeping files secure.'; }
  else if (p[0] === 'features') { body = viewFeatures(); title = 'Features — Scanix document scanner'; desc = 'Auto edge detection, image enhancement, OCR in 60+ languages, folders, backup, app lock and offline scanning.'; }
  else if (p[0] === 'about') { body = viewAbout(); title = 'About Scanix'; desc = 'Why Scanix processes documents on your device instead of uploading them to a server.'; }
  else if (p[0] === 'contact') { body = viewContact(); title = 'Contact Scanix'; desc = 'Support, bug reports, press and partnership enquiries.'; }
  else if (p[0] === 'help') { body = viewHelp(); title = 'Help Center — Scanix'; desc = 'Answers about file safety, size limits, offline use and failed conversions.'; }
  else if (p[0] === 'privacy') { body = viewLegal('privacy'); title = 'Privacy Policy — Scanix'; desc = 'What Scanix collects, what it does not, and how document processing stays on your device.'; }
  else if (p[0] === 'terms') { body = viewLegal('terms'); title = 'Terms & Conditions — Scanix'; desc = 'The terms that apply when you use the Scanix app and online tools.'; }
  else if (p[0] === 'download') { body = viewDownload(); title = 'Download Scanix for Android and iOS'; desc = 'Get the free Scanix document scanner app for Android and iOS.'; }
  else { body = view404(); title = 'Page not found — Scanix'; desc = 'This page does not exist.'; }

  $('#app').innerHTML = header(p.join('/')) + '<main id="main">' + body + '</main>' + footer();
  setMeta(title, desc, p.join('/'), faqs);
  if (p[0] === 'tools' && p[1] && ENGINE[p[1]]) initTool(p[1]);

}

/* ---------- global events ---------- */
// On the prerendered build every route is a real file, so send hash links to the clean URL.
document.addEventListener('click', e => {
  if (typeof window.__ROUTE__ === 'undefined' || e.defaultPrevented || e.metaKey || e.ctrlKey || e.button) return;
  const a = e.target.closest('a[href^="#/"]');
  if (!a) return;
  e.preventDefault();
  const p = a.getAttribute('href').replace(/^#\/?/, '').replace(/\/+$/, '');
  location.href = '/' + (p ? p + '/' : '');
}, true);
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-mv],[data-rm],[data-dl],.seg,.thumb-c,#burger,#subBtn,#cSend,#stage');
  if (!el) return;
  if (el.id === 'burger') { const m = $('#mobile'); m.classList.toggle('show'); el.setAttribute('aria-expanded', m.classList.contains('show')); return; }
  if (el.id === 'subBtn') { const v = $('#nl').value.trim(); toast(/.+@.+\..+/.test(v) ? 'Subscribed. Check your inbox.' : 'Enter a valid email address.'); return; }
  if (el.id === 'cSend') { toast('This demo has no backend, so nothing was sent.'); return; }
  if (el.dataset.mv) {
    const [i, d] = el.dataset.mv.split(',').map(Number), j = i + d;
    if (j < 0 || j >= ST.files.length) return;
    const a = ST.files[i]; ST.files[i] = ST.files[j]; ST.files[j] = a; paintFiles(); return;
  }
  if (el.dataset.rm) {
    ST.files.splice(+el.dataset.rm, 1); paintFiles(); UI.clear();
    if (!ST.files.length) $('#extra').innerHTML = '';
    return;
  }
  if (el.dataset.dl) {
    const outs = window._outs || [];
    if (el.dataset.dl === 'all') {
      const zip = outs.filter(o => /\.zip$/.test(o.name));
      (zip.length ? zip : outs).forEach((o, i) => setTimeout(() => saveBlob(o.blob, o.name), i * 300));
    }
    else { const o = outs[+el.dataset.dl]; if (o) saveBlob(o.blob, o.name); }
    
    return;
  }
  if (el.classList.contains('seg')) {
    const grp = el.closest('.segs'), name = grp.dataset.seg;
    $$('.seg', grp).forEach(b => b.classList.remove('on'));
    el.classList.add('on');
    if (name === 'pg') { ST.extra.page = +el.dataset.val; paintPreview(); }
    else { ST.opt[name] = el.dataset.val; applyConditionalFields(); }
    return;
  }
  if (el.classList.contains('thumb-c')) {
    el.classList.toggle('sel');
    const pg = +el.dataset.pg, k = ST.sel.indexOf(pg);
    if (k < 0) ST.sel.push(pg); else ST.sel.splice(k, 1);
    return;
  }
  if (el.id === 'stage') {
    const cv = $('#pv'), b = cv.getBoundingClientRect();
    const x = (e.clientX - b.left) / b.width, y = (e.clientY - b.top) / b.height;
    if (x < 0 || x > 1 || y < 0 || y > 1) return;
    ST.extra.pos = { x: x, y: y };
    const sig = signatureCanvas();
    const wPct = +ST.opt.size, hPct = sig ? wPct * (sig.height / sig.width) * (b.width / b.height) : 8;
    const g = $('#ghost');
    g.style.display = 'block';
    g.style.left = (x * 100 - wPct / 2) + '%';
    g.style.top = (y * 100 - hPct / 2) + '%';
    g.style.width = wPct + '%';
    g.style.height = hPct + '%';
  }
});
window.addEventListener('hashchange', () => renderRoute());
renderRoute();
